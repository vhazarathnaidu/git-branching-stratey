replicaCount: 2

metadata:
  labels:
    name: web1

image:
  repository: nginx
  tag: 1.25

selector:
  matchLabels:
    app: nginx
containers:
  - name: nginx

strategy:
  type: RollingUpdate
  rollingUpdate:
     maxUnavailable: 1
     maxSurge: 1

service:
  type: NodePort
ports: 
  - port: 80
    targetPort: 80
    NodePort: 30005

port:
  - containerPort: 80
    name: http

resources: 
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "200m"
    memory: "256Mi"
  
livenessProbe:
  httpGet:
    path: /
    port: 80
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5

readinessProbe:
  httpGet:
    path: /
    port: 80
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 5